spring.application.name=ai-resume-matcher
server.address=0.0.0.0

# ============================================================
# MySQL Database (replacing H2 — production-grade persistence)
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/resume_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8mb4
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# HikariCP Connection Pool Tuning
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ============================================================
# RabbitMQ (async resume processing pipeline)
# ============================================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=5
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2000

# ============================================================
# Redis (multi-level caching)
# ============================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=5000
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# ============================================================
# Elasticsearch (inverted-index job search)
# ============================================================
spring.elasticsearch.uris=http://localhost:9200
spring.elasticsearch.connection-timeout=5s
spring.elasticsearch.socket-timeout=30s

# ============================================================
# File Upload
# ============================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
resume.upload.dir=./uploads

# ============================================================
# OAuth2 (Google Login)
# ============================================================
spring.security.oauth2.client.registration.google.client-id=435287945705-aeo1pm9b4n2o3r1d7pa2dmeiigh2gp4o.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=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

# ============================================================
# LLM API Configuration
# ============================================================
llm.api.key=sk-4a78acc5c40a4ce7b51604dffcb4304f
llm.api.url=https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
llm.model=qwen-plus
llm.deepseek.api.key=sk-4a78acc5c40a4ce7b51604dffcb4304f
llm.deepseek.api.url=https://api.deepseek.com/v1/chat/completions
llm.deepseek.model=deepseek-chat

# ============================================================
# Resilience4j — Circuit Breaker for LLM API
# ============================================================
resilience4j.circuitbreaker.instances.llmService.sliding-window-size=10
resilience4j.circuitbreaker.instances.llmService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.llmService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.llmService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.llmService.slow-call-duration-threshold=10s
resilience4j.circuitbreaker.instances.llmService.slow-call-rate-threshold=80

# Resilience4j — Retry
resilience4j.retry.instances.llmService.max-attempts=3
resilience4j.retry.instances.llmService.wait-duration=2s
resilience4j.retry.instances.llmService.enable-exponential-backoff=true
resilience4j.retry.instances.llmService.exponential-backoff-multiplier=2

# Resilience4j — Rate Limiter
resilience4j.ratelimiter.instances.llmService.limit-for-period=10
resilience4j.ratelimiter.instances.llmService.limit-refresh-period=1s
resilience4j.ratelimiter.instances.llmService.timeout-duration=5s

# ============================================================
# Actuator (Observability endpoints)
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,ratelimiters
management.endpoint.health.show-details=when-authorized
management.health.elasticsearch.enabled=true
management.health.rabbit.enabled=true
management.health.redis.enabled=true

# ============================================================
# Logging
# ============================================================
logging.level.com.example.hello=INFO
logging.level.org.springframework.amqp=INFO
logging.level.io.github.resilience4j=DEBUG
